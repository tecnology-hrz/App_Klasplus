<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasplus - Cargando...</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1565C0">
    <meta name="description" content="Klasplus: brigada escolar, zonas de peligro, tienda de puntos y asistente IA.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Klasplus">
    <link rel="apple-touch-icon" href="src/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="src/img/favicon-64.png">
    <link rel="icon" type="image/png" sizes="192x192" href="src/img/icon-192.png">
    <link rel="stylesheet" href="src/css/mobile-frame.css">
    <script src="src/js/pwa.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #E3F2FD;
            border-top: 6px solid #1565C0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #1565C0;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .splash-logo {
            width: 240px;
            max-width: 70vw;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <img src="src/img/logo-klasplus.png" alt="Klasplus - Escuelas Seguras" class="splash-logo">
        <div class="spinner"></div>
        <div class="loading-text">Cargando...</div>
    </img>

    <script>
        // Verificar si hay sesión activa
        const userId = localStorage.getItem('userId');
        const userRole = localStorage.getItem('userRole');
        
        if (userId && userRole) {
            // Si hay sesión, redirigir al dashboard principal
            window.location.href = 'src/secciones/dashboard.html';
        } else {
            // Si no hay sesión, redirigir al login después de 1 segundo
            setTimeout(function() {
                window.location.href = 'src/secciones/login.html';
            }, 1000);
        }
    </script>
</body>
</html>
